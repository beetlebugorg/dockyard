name: CI

# Builds dockyard and runs its tests on Linux for each push to main and
# each pull request. The tests open the window on the headless backend,
# with /bin/sh as the agent program.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of its old commit. Runs
# on main do not cancel each other: each one completes and saves the Zig
# cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: "0.17.0"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The ztk build compiles shaders with glslc and links Wayland.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libwayland-dev libxkbcommon-dev wayland-protocols
      # One zig build for the program and the tests, so that Zig
      # compiles them in parallel.
      - name: Build and test
        run: |
          ulimit -v 6000000
          zig build install test

  skill:
    name: Skill (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The Linux programs of ztk compile their Vulkan shaders with glslc.
      - name: Install glslc
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
      # The skill zip has the ztk programs of all the targets. Its size
      # must stay under the upload limit (tools/skill.sh checks it).
      - name: Build the skill zip
        run: tools/skill.sh
      - name: Test the skill as a sandbox uses it
        run: tools/skill-test.sh
