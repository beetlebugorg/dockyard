name: CI

# Builds dockyard and runs its tests on Linux for each push to main and
# each pull request. The tests open the window on the headless backend,
# with /bin/sh as the agent program.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The scheduled run builds the skill zip with all six targets and
  # checks its size. Pull requests and pushes build two targets.
  schedule:
    - cron: "53 */6 * * *"

permissions:
  contents: read

# A new push to a pull request cancels the run of its old commit. Runs
# on main do not cancel each other: each one completes and saves the Zig
# cache. A scheduled run has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: "0.17.0"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The ztk build compiles shaders with glslc and links Wayland.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libwayland-dev libxkbcommon-dev wayland-protocols
      # One zig build for the program and the tests, so that Zig
      # compiles them in parallel.
      - name: Build and test
        run: |
          ulimit -v 6000000
          zig build install test

  # Windows: the program and the tests, with cmd.exe as the shell of the
  # terminal pane through ConPTY. It runs in the scheduled run and on a
  # dispatch, so it does not gate a pull request.
  test-windows:
    name: Test (Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build and test
        run: zig build install test

  skill:
    name: Skill (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The Linux programs of ztk compile their Vulkan shaders with glslc.
      - name: Install glslc
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
      # The skill zip has the ztk programs of all the targets. Its size
      # must stay under the upload limit (tools/skill.sh checks it). Pull
      # requests and pushes build the two targets of tools/skill-test.sh,
      # and the scheduled run builds all six.
      - name: Build the skill zip
        env:
          SKILL_TARGETS: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'x86_64-linux,x86_64-windows' || '' }}
        run: tools/skill.sh
      - name: Test the skill as a sandbox uses it
        run: tools/skill-test.sh

  # A failure of the scheduled full run opens an issue, so it is fixed
  # in the next batch of work.
  report:
    name: Report a failure of the full run
    if: failure() && github.event_name == 'schedule'
    needs: [test, test-windows, skill]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "The full CI run failed on $(date -u +%Y-%m-%d)" \
            --body "The scheduled full run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
